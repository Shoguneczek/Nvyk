<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Návyk</title>
<meta name="theme-color" content="#256C58">
<meta name="description" content="Jednoduché sledování denních návyků se sériemi.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<!--
  AdSense — vlož sem svůj vlastní script tag AŽ po schválení účtu na
  https://adsense.google.com (nahraď ca-pub-XXXXXXXXXXXXXXXX):
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap">
<style>
  :root {
    --bg: #F5F4EF;
    --card: #FFFFFF;
    --ink: #1B2320;
    --ink-soft: #667169;
    --line: #E6E3D9;
    --accent: #256C58;
    --accent-soft: #E1EEE8;
    --hero-a: #1E5C4B;
    --hero-b: #2F8068;
    --ring-track: rgba(255,255,255,0.28);
    --shadow: 0 10px 26px rgba(27,35,32,0.08);
  }
  :root[data-theme="dark"] {
    --bg: #121613;
    --card: #1B211D;
    --ink: #EDEFEB;
    --ink-soft: #8FA098;
    --line: #2A322D;
    --accent: #5FB596;
    --accent-soft: #1E2C26;
    --hero-a: #10241E;
    --hero-b: #163B30;
    --ring-track: rgba(255,255,255,0.14);
    --shadow: 0 10px 26px rgba(0,0,0,0.35);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121613;
      --card: #1B211D;
      --ink: #EDEFEB;
      --ink-soft: #8FA098;
      --line: #2A322D;
      --accent: #5FB596;
      --accent-soft: #1E2C26;
      --hero-a: #10241E;
      --hero-b: #163B30;
      --ring-track: rgba(255,255,255,0.14);
      --shadow: 0 10px 26px rgba(0,0,0,0.35);
    }
  }
  html, body { height: 100%; margin: 0; }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 16px 110px; min-height: 100%; }

  .hero {
    background: linear-gradient(155deg, var(--hero-a), var(--hero-b));
    border-radius: 0 0 28px 28px;
    margin: 0 -16px 20px;
    padding: calc(18px + env(safe-area-inset-top,0px)) 20px 22px;
    color: #F4FBF8;
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .hero-text { flex: 1; min-width: 0; }
  .hero-eyebrow { font-size: 13px; opacity: 0.75; margin: 0 0 2px; text-transform: capitalize; }
  .hero-title { font-size: 22px; font-weight: 800; margin: 0 0 10px; letter-spacing: -0.02em; }
  .hero-sub { font-size: 13px; opacity: 0.8; }
  .theme-btn {
    border: none; background: rgba(255,255,255,0.14); color: #F4FBF8;
    width: 38px; height: 38px; border-radius: 50%; font-size: 17px;
    cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  }
  .ring-wrap { position: relative; width: 74px; height: 74px; flex-shrink: 0; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-track { stroke: var(--ring-track); }
  .ring-fill { stroke: #F4FBF8; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }
  .ring-label {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px;
  }

  .section-title { font-size: 13px; color: var(--ink-soft); margin: 4px 2px 10px; font-weight: 600; }

  .habits { display: flex; flex-direction: column; gap: 10px; }
  .habit {
    background: var(--card);
    border-radius: 18px;
    padding: 13px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow);
  }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 14px; border: none;
    font-size: 20px; flex-shrink: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .habit-body { flex: 1; min-width: 0; }
  .habit-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .habit-name { font-weight: 700; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .streak-tag { font-size: 12.5px; font-weight: 700; display: flex; align-items: center; gap: 3px; flex-shrink: 0; }
  .streak-tag.grey { color: var(--ink-soft); }
  .dots { display: flex; gap: 5px; margin-top: 8px; }
  .dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line); flex-shrink: 0; }
  .dot.today { box-shadow: 0 0 0 2px var(--accent-soft); }
  .check {
    width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line);
    background: transparent; flex-shrink: 0; cursor: pointer; font-size: 15px;
    display: flex; align-items: center; justify-content: center; color: transparent;
    transition: transform .12s ease;
  }
  .check:active { transform: scale(0.88); }
  .check.done { color: white; border-color: transparent; }
  .menu-btn { border: none; background: transparent; color: var(--ink-soft); font-size: 18px; padding: 4px 2px; cursor: pointer; flex-shrink: 0; }

  .empty { text-align: center; color: var(--ink-soft); padding: 44px 12px; border: 1px dashed var(--line); border-radius: 18px; }

  .fab {
    position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%); background: var(--accent); color: white; border: none;
    border-radius: 999px; padding: 14px 26px; font-size: 15px; font-weight: 700;
    font-family: inherit; box-shadow: 0 10px 26px rgba(0,0,0,0.22); cursor: pointer;
  }

  .ad-slot { margin-top: 18px; border: 1px dashed var(--line); border-radius: 14px; padding: 12px; text-align: center; color: var(--ink-soft); font-size: 12px; }

  .sheet-backdrop { position: fixed; inset: 0; background: rgba(10,14,12,0.45); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet-backdrop.open { display: flex; }
  .sheet { background: var(--bg); width: 100%; max-width: 480px; border-radius: 22px 22px 0 0; padding: 22px 20px calc(24px + env(safe-area-inset-bottom, 0px)); }
  .sheet h2 { margin: 0 0 14px; font-size: 18px; }
  .sheet input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-family: inherit; font-size: 16px; margin-bottom: 14px; }
  .picker-label { font-size: 12.5px; color: var(--ink-soft); font-weight: 600; margin: 0 0 8px; }
  .emoji-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .emoji-opt { width: 40px; height: 40px; border-radius: 12px; border: 2px solid transparent; background: var(--accent-soft); font-size: 18px; cursor: pointer; }
  .emoji-opt.sel { border-color: var(--accent); }
  .color-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .color-opt { width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
  .color-opt.sel { border-color: var(--ink); }
  .sheet-actions { display: flex; gap: 10px; }
  .btn { flex: 1; border: none; border-radius: 12px; padding: 12px; font-family: inherit; font-weight: 700; font-size: 15px; cursor: pointer; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-ghost { background: var(--accent-soft); color: var(--accent); }
  .btn-danger { background: #F5DEDA; color: #A8402E; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="hero-text">
      <p class="hero-eyebrow" id="dateLabel"></p>
      <p class="hero-title">Dnešní návyky</p>
      <p class="hero-sub" id="heroSub">Zatím nic nesplněno</p>
    </div>
    <div class="ring-wrap">
      <svg width="74" height="74" viewBox="0 0 74 74">
        <circle class="ring-track" cx="37" cy="37" r="30" fill="none" stroke-width="7"/>
        <circle class="ring-fill" id="ringFill" cx="37" cy="37" r="30" fill="none" stroke-width="7" stroke-dasharray="188.5" stroke-dashoffset="188.5"/>
      </svg>
      <div class="ring-label" id="ringLabel">0/0</div>
    </div>
    <button class="theme-btn" id="themeBtn" title="Přepnout motiv">◐</button>
  </div>

  <p class="section-title">Tvoje návyky</p>
  <div class="habits" id="habitList"></div>

  <div class="ad-slot" id="adSlot">
    Místo pro reklamní banner<br>
    (web verze: AdSense · appka: AdMob — viz níže)
  </div>
</div>

<button class="fab" id="openAdd">+ Přidat návyk</button>

<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet">
    <h2 id="sheetTitle">Nový návyk</h2>
    <input id="newHabitName" placeholder="Např. Meditace, Čtení, Pití vody…" maxlength="40">
    <p class="picker-label">Ikonka</p>
    <div class="emoji-grid" id="emojiGrid"></div>
    <p class="picker-label">Barva</p>
    <div class="color-row" id="colorRow"></div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="cancelAdd">Zrušit</button>
      <button class="btn btn-primary" id="confirmAdd">Uložit</button>
    </div>
    <div class="sheet-actions" id="deleteRow" style="display:none; margin-top:10px;">
      <button class="btn btn-danger" id="deleteHabit">Smazat návyk</button>
    </div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'habit-tracker-v2';
  const OLD_KEY = 'habit-tracker-v1';
  const EMOJIS = ['⭐','💧','📖','🧘','🏃','🥗','😴','✍️','🎯','🚭','💪','🎨'];
  const COLORS = ['#256C58','#E2963A','#7C5CBF','#E2725B','#3E7CB1','#7C8C4B'];
  const todayStr = () => new Date().toISOString().slice(0,10);
  const dayDiff = (a,b) => Math.round((new Date(b) - new Date(a)) / 86400000);

  function load() {
    try {
      let raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        const old = localStorage.getItem(OLD_KEY);
        if (old) {
          const parsed = JSON.parse(old);
          return parsed.map((h,i) => ({ ...h, emoji: EMOJIS[i % EMOJIS.length], color: COLORS[i % COLORS.length] }));
        }
        return [];
      }
      return JSON.parse(raw);
    } catch(e) { return []; }
  }
  function save(habits) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(habits)); } catch(e) {} }

  let habits = load();
  let editingId = null;
  let pickedEmoji = EMOJIS[0];
  let pickedColor = COLORS[0];

  function currentStreak(h) {
    if (!h.log.length) return 0;
    const dates = [...h.log].sort();
    let streak = 1;
    for (let i = dates.length - 1; i > 0; i--) {
      if (dayDiff(dates[i-1], dates[i]) === 1) streak++; else break;
    }
    const gap = dayDiff(dates[dates.length - 1], todayStr());
    return gap > 1 ? 0 : streak;
  }

  function last7(h) {
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const key = d.toISOString().slice(0,10);
      days.push({ key, done: h.log.includes(key), isToday: i === 0 });
    }
    return days;
  }

  function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function render() {
    const list = document.getElementById('habitList');
    list.innerHTML = '';
    if (!habits.length) {
      list.innerHTML = '<div class="empty">Zatím žádné návyky.<br>Přidej první tlačítkem dole.</div>';
    }
    let doneCount = 0;
    habits.forEach(h => {
      const done = h.log.includes(todayStr());
      if (done) doneCount++;
      const streak = currentStreak(h);
      const tagClass = streak >= 7 ? '' : 'grey';
      const row = document.createElement('div');
      row.className = 'habit';
      const dotsHtml = last7(h).map(d =>
        `<div class="dot ${d.isToday ? 'today' : ''}" style="${d.done ? `background:${h.color};border-color:${h.color}` : ''}"></div>`
      ).join('');
      row.innerHTML = `
        <button class="icon-btn" style="background:${h.color}22" data-edit="${h.id}">${h.emoji}</button>
        <div class="habit-body">
          <div class="habit-top">
            <div class="habit-name">${escapeHtml(h.name)}</div>
            <div class="streak-tag ${tagClass}">🔥${streak}</div>
          </div>
          <div class="dots">${dotsHtml}</div>
        </div>
        <button class="check ${done ? 'done' : ''}" style="${done ? `background:${h.color}` : ''}" data-id="${h.id}">✓</button>
      `;
      list.appendChild(row);
    });
    document.getElementById('ringLabel').textContent = `${doneCount}/${habits.length}`;
    document.getElementById('heroSub').textContent = habits.length
      ? (doneCount === habits.length ? 'Všechno splněno, skvělá práce!' : `Zbývá ${habits.length - doneCount} z ${habits.length}`)
      : 'Přidej svůj první návyk';
    const circumference = 188.5;
    const pct = habits.length ? doneCount / habits.length : 0;
    document.getElementById('ringFill').style.strokeDashoffset = circumference * (1 - pct);
  }

  document.getElementById('habitList').addEventListener('click', (e) => {
    const checkBtn = e.target.closest('.check');
    const editBtn = e.target.closest('[data-edit]');
    if (checkBtn) {
      const h = habits.find(x => x.id === checkBtn.dataset.id);
      const t = todayStr();
      const idx = h.log.indexOf(t);
      if (idx >= 0) h.log.splice(idx, 1); else h.log.push(t);
      save(habits);
      render();
    } else if (editBtn) {
      openSheet(editBtn.dataset.edit);
    }
  });

  function buildPickers() {
    const eg = document.getElementById('emojiGrid');
    eg.innerHTML = EMOJIS.map(em => `<button type="button" class="emoji-opt ${em===pickedEmoji?'sel':''}" data-emoji="${em}">${em}</button>`).join('');
    eg.querySelectorAll('[data-emoji]').forEach(btn => btn.onclick = () => { pickedEmoji = btn.dataset.emoji; buildPickers(); });
    const cr = document.getElementById('colorRow');
    cr.innerHTML = COLORS.map(c => `<button type="button" class="color-opt ${c===pickedColor?'sel':''}" style="background:${c}" data-color="${c}"></button>`).join('');
    cr.querySelectorAll('[data-color]').forEach(btn => btn.onclick = () => { pickedColor = btn.dataset.color; buildPickers(); });
  }

  const backdrop = document.getElementById('sheetBackdrop');
  function openSheet(id) {
    editingId = id || null;
    const h = id ? habits.find(x => x.id === id) : null;
    document.getElementById('sheetTitle').textContent = h ? 'Upravit návyk' : 'Nový návyk';
    document.getElementById('newHabitName').value = h ? h.name : '';
    pickedEmoji = h ? h.emoji : EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
    pickedColor = h ? h.color : COLORS[habits.length % COLORS.length];
    document.getElementById('deleteRow').style.display = h ? 'flex' : 'none';
    buildPickers();
    backdrop.classList.add('open');
    if (!h) document.getElementById('newHabitName').focus();
  }
  document.getElementById('openAdd').onclick = () => openSheet(null);
  document.getElementById('cancelAdd').onclick = () => backdrop.classList.remove('open');
  backdrop.onclick = (e) => { if (e.target === backdrop) backdrop.classList.remove('open'); };

  document.getElementById('confirmAdd').onclick = () => {
    const name = document.getElementById('newHabitName').value.trim();
    if (!name) return;
    if (editingId) {
      const h = habits.find(x => x.id === editingId);
      h.name = name; h.emoji = pickedEmoji; h.color = pickedColor;
    } else {
      habits.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), name, emoji: pickedEmoji, color: pickedColor, log: [] });
    }
    save(habits);
    backdrop.classList.remove('open');
    render();
  };
  document.getElementById('deleteHabit').onclick = () => {
    habits = habits.filter(x => x.id !== editingId);
    save(habits);
    backdrop.classList.remove('open');
    render();
  };
  document.getElementById('newHabitName').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('confirmAdd').click(); });

  const themeBtn = document.getElementById('themeBtn');
  function applyTheme(t) {
    if (t) document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
  }
  let savedTheme = null;
  try { savedTheme = localStorage.getItem('habit-tracker-theme'); } catch(e) {}
  applyTheme(savedTheme);
  themeBtn.onclick = () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark'
      || (!document.documentElement.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    const next = isDark ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem('habit-tracker-theme', next); } catch(e) {}
  };

  document.getElementById('dateLabel').textContent = new Date().toLocaleDateString('cs-CZ', { weekday: 'long', day: 'numeric', month: 'long' });

  render();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
